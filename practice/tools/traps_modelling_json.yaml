dm-001:
  wrong: |
    SELECT table_name, count(*) AS column_count FROM information_schema.columns
    WHERE table_name IN (SELECT table_name FROM information_schema.tables WHERE table_schema = current_schema())
    GROUP BY table_name ORDER BY table_name
  right: |
    SELECT c.relname AS table_name, count(*) AS column_count
    FROM pg_class c JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
    WHERE c.relnamespace = current_schema()::regnamespace AND c.relkind = 'r'
    GROUP BY c.relname ORDER BY c.relname
dm-002:
  wrong: |
    SELECT conrelid::regclass::text AS table_name, cardinality(conkey) AS key_columns
    FROM pg_constraint WHERE contype IN ('p', 'u') AND connamespace = current_schema()::regnamespace AND cardinality(conkey) > 1 ORDER BY 1
  right: |
    SELECT c.conrelid::regclass::text AS table_name, count(*)::int AS key_columns
    FROM pg_constraint c CROSS JOIN LATERAL unnest(c.conkey) AS k(attnum)
    WHERE c.contype = 'p' AND c.connamespace = current_schema()::regnamespace
    GROUP BY c.oid, 1 HAVING count(*) > 1 ORDER BY 1
dm-003:
  wrong: |
    SELECT c.conrelid::regclass::text AS table_name, a.attname AS columns, c.confrelid::regclass::text AS referenced_table
    FROM pg_constraint c JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = ANY (c.conkey)
    WHERE c.contype = 'f' AND c.connamespace = current_schema()::regnamespace ORDER BY 1, 2
  right: |
    SELECT c.conrelid::regclass::text AS table_name, string_agg(a.attname, ', ' ORDER BY array_position(c.conkey, a.attnum)) AS columns, c.confrelid::regclass::text AS referenced_table
    FROM pg_constraint c JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = ANY (c.conkey)
    WHERE c.contype = 'f' AND c.connamespace = current_schema()::regnamespace
    GROUP BY c.oid, 1, 3 ORDER BY 1, 2
dm-004:
