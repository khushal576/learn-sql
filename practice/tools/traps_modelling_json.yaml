dm-010:
  wrong: |
    SELECT c.table_name, c.column_name,
           (xpath('/row/n/text()', x.r))[1]::text::int AS null_rows,
           (xpath('/row/t/text()', x.r))[1]::text::int AS total_rows
    FROM information_schema.columns c
    CROSS JOIN LATERAL query_to_xml(format('SELECT count(*) - count(%I) AS n, count(*) AS t FROM %I.%I', c.column_name, c.table_schema, c.table_name), false, true, '') AS x(r)
    WHERE c.table_schema = current_schema()
    ORDER BY c.table_name, c.column_name
  right: |
    SELECT a.attrelid::regclass::text AS table_name, a.attname AS column_name,
           (xpath('/row/n/text()', x.r))[1]::text::int AS null_rows,
           (xpath('/row/t/text()', x.r))[1]::text::int AS total_rows
    FROM pg_attribute a JOIN pg_class k ON k.oid = a.attrelid
    CROSS JOIN LATERAL query_to_xml(format('SELECT count(*) - count(%I) AS n, count(*) AS t FROM %s', a.attname, a.attrelid::regclass), false, true, '') AS x(r)
    WHERE k.relnamespace = current_schema()::regnamespace AND k.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped AND NOT a.attnotnull
    ORDER BY 1, 2
