    SELECT u.id AS user_id, u.plan AS stored_plan, s.plan AS current_plan
    FROM users u JOIN subscriptions s ON s.user_id = u.id
    WHERE u.plan <> s.plan AND EXISTS (SELECT 1 FROM subscriptions c WHERE c.user_id = u.id AND c.ended_on IS NULL)
