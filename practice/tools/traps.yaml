# Per question: a tempting WRONG answer (must fail Check) and a differently written CORRECT answer (must pass). Run: python3 tools/check_traps.py
jn-003:
  right: SELECT c.title, coalesce(t.name,'Unassigned') AS teacher FROM teachers t RIGHT JOIN courses c ON c.teacher_id = t.id ORDER BY c.id
  wrong: SELECT c.title, t.name AS teacher FROM courses c JOIN teachers t ON t.id = c.teacher_id ORDER BY c.id
jn-004:
  right: SELECT t.id, t.name FROM teachers t LEFT JOIN courses c ON c.teacher_id = t.id WHERE c.id IS NULL ORDER BY t.id
  wrong: SELECT id, name FROM teachers WHERE id NOT IN (SELECT teacher_id FROM courses) ORDER BY id
jn-005:
  right: SELECT e.id, e.name, m.name AS manager FROM employees m RIGHT JOIN employees e ON m.id = e.manager_id WHERE e.id <= 8 ORDER BY e.id
  wrong: SELECT e.id, e.name, m.name AS manager FROM employees e JOIN employees m ON m.id = e.manager_id WHERE e.id <= 8 ORDER BY e.id
jn-006:
  right: SELECT c.id AS customer_id, count(*) AS orders, sum(t.v) AS order_value FROM customers c JOIN (SELECT o.id, o.customer_id, sum(i.quantity*i.unit_price) v FROM orders o JOIN order_items i ON i.order_id=o.id GROUP BY
    o.id) t ON t.customer_id=c.id WHERE c.id<=20 GROUP BY c.id ORDER BY c.id
  wrong: SELECT c.id AS customer_id, count(*) AS orders, sum(i.quantity*i.unit_price) AS order_value FROM customers c JOIN orders o ON o.customer_id=c.id JOIN order_items i ON i.order_id=o.id WHERE c.id<=20 GROUP BY c.id ORDER
    BY c.id
jn-007:
  right: SELECT p.id AS product_id, (SELECT coalesce(sum(quantity),0) FROM order_items i WHERE i.product_id=p.id) AS units_sold, (SELECT count(*) FROM reviews r WHERE r.product_id=p.id) AS review_count FROM products p WHERE
    p.id<=10 ORDER BY p.id
  wrong: SELECT p.id AS product_id, sum(i.quantity) AS units_sold, count(r.id) AS review_count FROM products p LEFT JOIN order_items i ON i.product_id=p.id LEFT JOIN reviews r ON r.product_id=p.id WHERE p.id<=10 GROUP BY p.id
    ORDER BY p.id
jn-008:
  right: SELECT c.id AS course_id, c.title, (SELECT count(*) FROM scores s WHERE s.course_id=c.id AND s.exam='final' AND s.score>=95) AS top_finals FROM courses c ORDER BY c.id
  wrong: SELECT c.id AS course_id, c.title, count(s.id) AS top_finals FROM courses c LEFT JOIN scores s ON s.course_id=c.id WHERE s.exam='final' AND s.score>=95 GROUP BY c.id, c.title ORDER BY c.id
jn-009:
  right: SELECT a.id AS emp_a, b.id AS emp_b, a.dept_id FROM employees a JOIN employees b ON b.dept_id=a.dept_id AND b.id>a.id WHERE a.job_title='Director' AND b.job_title='Director' ORDER BY 3,1,2
  wrong: SELECT a.id AS emp_a, b.id AS emp_b, a.dept_id FROM employees a JOIN employees b ON a.dept_id=b.dept_id AND a.id<>b.id WHERE a.job_title='Director' AND b.job_title='Director' ORDER BY a.dept_id, a.id, b.id
jn-010:
  right: SELECT m.id, m.name, (SELECT count(*) FROM employees r WHERE r.manager_id=m.id) AS direct_reports FROM employees m WHERE m.id<=40 ORDER BY m.id
  wrong: SELECT m.id, m.name, count(*) AS direct_reports FROM employees m LEFT JOIN employees r ON r.manager_id=m.id WHERE m.id<=40 GROUP BY m.id, m.name ORDER BY m.id
jn-011:
  right: SELECT id AS customer_id FROM customers c WHERE c.id<=30 AND (EXISTS (SELECT 1 FROM orders o WHERE o.customer_id=c.id) OR EXISTS (SELECT 1 FROM reviews r WHERE r.customer_id=c.id)) ORDER BY 1
  wrong: SELECT customer_id FROM orders WHERE customer_id<=30 UNION ALL SELECT customer_id FROM reviews WHERE customer_id<=30 ORDER BY customer_id
jn-012:
  right: SELECT s.student_id, s.course_id, s.score, (SELECT letter FROM grade_bands b WHERE s.score>=b.min_score AND s.score<b.max_score) AS letter FROM scores s WHERE exam='final' AND course_id<=3 ORDER BY 1,2
  wrong: SELECT s.student_id, s.course_id, s.score, b.letter FROM scores s JOIN grade_bands b ON s.score BETWEEN b.min_score AND b.max_score WHERE s.exam='final' AND s.course_id<=3 ORDER BY s.student_id, s.course_id
jn-013:
  right: SELECT e.id, e.name, e.manager_id FROM employees e WHERE e.dept_id=1 AND e.hire_date < (SELECT hire_date FROM employees m WHERE m.id=e.manager_id) ORDER BY e.id
  wrong: SELECT e.id, e.name, e.manager_id FROM employees e JOIN employees m ON m.dept_id = e.dept_id AND m.id <> e.id WHERE e.dept_id = 1 AND e.hire_date < m.hire_date ORDER BY e.id
jn-014:
  right: SELECT DISTINCT r.customer_id FROM reviews r WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = r.customer_id) ORDER BY 1
  wrong: SELECT r.customer_id FROM reviews r LEFT JOIN orders o ON o.customer_id=r.customer_id WHERE o.id IS NULL ORDER BY r.customer_id
jn-015:
  right: SELECT t.name AS teacher, c.title AS course FROM teachers t LEFT JOIN courses c ON c.teacher_id = t.id UNION ALL SELECT NULL, title FROM courses WHERE teacher_id IS NULL
  wrong: SELECT t.name AS teacher, c.title AS course FROM teachers t LEFT JOIN courses c ON c.teacher_id = t.id
jn-016:
  right: SELECT customer_id, order_id, order_date FROM (SELECT customer_id, id AS order_id, order_date, row_number() OVER (PARTITION BY customer_id ORDER BY order_date DESC, id DESC) rn FROM orders WHERE customer_id<=10) t
    WHERE rn<=2 ORDER BY customer_id, order_date DESC, order_id DESC
  wrong: SELECT c.id AS customer_id, o.id AS order_id, o.order_date FROM customers c JOIN orders o ON o.customer_id=c.id WHERE c.id<=10 ORDER BY o.order_date DESC, o.id DESC LIMIT 2
jn-017:
  right: SELECT c.id AS customer_id, (SELECT o.id FROM orders o WHERE o.customer_id=c.id ORDER BY o.order_date DESC, o.id DESC LIMIT 1) AS last_order_id, (SELECT o.order_date FROM orders o WHERE o.customer_id=c.id ORDER BY
    o.order_date DESC, o.id DESC LIMIT 1) AS last_order_date FROM customers c WHERE c.id BETWEEN 536 AND 545 ORDER BY c.id
  wrong: SELECT c.id AS customer_id, o.id AS last_order_id, o.order_date AS last_order_date FROM customers c CROSS JOIN LATERAL (SELECT id, order_date FROM orders WHERE customer_id=c.id ORDER BY order_date DESC, id DESC LIMIT
    1) o WHERE c.id BETWEEN 536 AND 545 ORDER BY c.id
jn-018:
  right: SELECT s.id AS student_id, s.name FROM students s WHERE NOT EXISTS (SELECT 1 FROM courses c WHERE c.teacher_id=3 AND NOT EXISTS (SELECT 1 FROM enrollments e WHERE e.student_id=s.id AND e.course_id=c.id AND e.status<>'dropped'))
    ORDER BY s.id
  wrong: SELECT s.id AS student_id, s.name FROM students s JOIN enrollments e ON e.student_id=s.id JOIN courses c ON c.id=e.course_id WHERE c.teacher_id=3 AND e.status<>'dropped' GROUP BY s.id, s.name HAVING count(*)>=1 ORDER
    BY s.id
jn-019:
  right: SELECT t.id AS teacher_id, (SELECT count(*) FROM courses c WHERE c.teacher_id=t.id) AS courses, (SELECT count(DISTINCT e.student_id) FROM enrollments e JOIN courses c ON c.id=e.course_id WHERE c.teacher_id=t.id) AS
    students, (SELECT round(avg(s.score),2) FROM scores s JOIN courses c ON c.id=s.course_id WHERE c.teacher_id=t.id AND s.exam='midterm') AS avg_midterm FROM teachers t ORDER BY t.id
  wrong: SELECT t.id AS teacher_id, count(c.id) AS courses, count(e.student_id) AS students, round(avg(s.score),2) AS avg_midterm FROM teachers t JOIN courses c ON c.teacher_id=t.id JOIN enrollments e ON e.course_id=c.id JOIN
    scores s ON s.student_id=e.student_id GROUP BY t.id ORDER BY 1
jn-020:
  right: SELECT r.id AS review_id, r.customer_id, r.product_id FROM reviews r LEFT JOIN (SELECT o.customer_id, i.product_id FROM orders o JOIN order_items i ON i.order_id=o.id) b ON b.customer_id=r.customer_id AND b.product_id=r.product_id
    WHERE r.product_id<=5 AND b.customer_id IS NULL ORDER BY r.id
  wrong: SELECT r.id AS review_id, r.customer_id, r.product_id FROM reviews r WHERE r.product_id<=5 AND r.customer_id NOT IN (SELECT customer_id FROM orders) ORDER BY r.id
sb-002:
  right: SELECT count(*) AS total_customers, count(city) AS with_city, count(DISTINCT city) AS distinct_cities FROM customers
  wrong: SELECT count(*) AS total_customers, count(*) AS with_city, count(*) AS distinct_cities FROM customers
sb-003:
  right: SELECT id, name, price FROM products WHERE lower(name) LIKE '%pro%laptop%' ORDER BY id
  wrong: SELECT id, name, price FROM products WHERE name LIKE '%pro%laptop%' ORDER BY id
sb-004:
  right: SELECT id, name, salary + coalesce(commission, 0) AS total_pay FROM employees WHERE dept_id = 2 ORDER BY 3 DESC, 1
  wrong: SELECT id, name, salary + commission AS total_pay FROM employees WHERE dept_id = 2 ORDER BY total_pay DESC, id
sb-005:
  right: SELECT id, order_id, amount, paid_at FROM payments WHERE date_trunc('month', paid_at) = DATE '2023-03-01' ORDER BY paid_at, id
  wrong: SELECT id, order_id, amount, paid_at FROM payments WHERE paid_at BETWEEN '2023-03-01' AND '2023-03-31' ORDER BY paid_at, id
sb-006:
  right: SELECT id, name, commission FROM employees WHERE dept_id IN (2,4,6) AND coalesce(commission, 0) <= 2500 ORDER BY id
  wrong: SELECT id, name, commission FROM employees WHERE dept_id IN (2,4,6) AND commission <= 2500 ORDER BY id
sb-007:
  right: SELECT id, name, city FROM customers WHERE segment = 'corporate' AND (city <> 'Pune' OR city IS NULL) ORDER BY id
  wrong: SELECT id, name, city FROM customers WHERE segment = 'corporate' AND city <> 'Pune' ORDER BY id
sb-008:
  right: SELECT id, name, signup_date FROM customers WHERE signup_date BETWEEN DATE '2024-06-30' - 90 AND DATE '2024-06-30' ORDER BY signup_date, id
  wrong: SELECT id, name, signup_date FROM customers WHERE signup_date > DATE '2024-06-30' - 90 ORDER BY signup_date, id
sb-009:
  right: SELECT CASE WHEN salary < 60000 THEN 'junior' WHEN salary < 100000 THEN 'mid' ELSE 'senior' END AS band, count(*) AS headcount FROM employees GROUP BY 1 ORDER BY min(salary)
  wrong: SELECT band, count(*) AS headcount FROM (SELECT CASE WHEN salary < 60000 THEN 'junior' WHEN salary BETWEEN 60000 AND 100000 THEN 'mid' ELSE 'senior' END AS band FROM employees) t GROUP BY band ORDER BY CASE band WHEN
    'junior' THEN 1 WHEN 'mid' THEN 2 ELSE 3 END
sb-010:
  right: SELECT id, status, CASE WHEN status = 'cancelled' THEN 'Cancelled' WHEN shipped_date IS NULL THEN 'Open' WHEN shipped_date > order_date + 3 THEN 'Late' ELSE 'On time' END AS label FROM orders WHERE order_date BETWEEN
    '2023-01-01' AND '2023-01-10' ORDER BY id
  wrong: SELECT id, status, CASE WHEN shipped_date IS NULL THEN 'Open' WHEN status = 'cancelled' THEN 'Cancelled' WHEN shipped_date - order_date > 3 THEN 'Late' ELSE 'On time' END AS label FROM orders WHERE order_date BETWEEN
    '2023-01-01' AND '2023-01-10' ORDER BY id
sb-011:
  right: SELECT product_id, order_id, quantity FROM (SELECT *, row_number() OVER (PARTITION BY product_id ORDER BY quantity DESC, order_id DESC) rn FROM order_items WHERE product_id <= 15) t WHERE rn = 1 ORDER BY product_id
  wrong: SELECT DISTINCT ON (product_id) product_id, order_id, quantity FROM order_items WHERE product_id <= 15 ORDER BY product_id, quantity DESC
sb-012:
  right: SELECT id, customer_id, order_date FROM (SELECT *, rank() OVER (ORDER BY order_date DESC) rk FROM orders) t WHERE rk <= 5
  wrong: SELECT id, customer_id, order_date FROM orders ORDER BY order_date DESC LIMIT 5
