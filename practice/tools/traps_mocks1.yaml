mk-015:
  wrong: |
    WITH w AS (
      SELECT p.id AS project_id, p.name AS project, od.name AS owner_dept, count(*) AS team_size,
             count(*) FILTER (WHERE e.dept_id <> p.dept_id) AS outside_staff,
             sum(a.hours) AS hours, sum(a.hours) FILTER (WHERE e.dept_id <> p.dept_id) AS outside_hours
      FROM projects p JOIN departments od ON od.id = p.dept_id JOIN project_assignments a ON a.project_id = p.id
      JOIN employees e ON e.id = a.emp_id WHERE e.hire_date <= p.start_date GROUP BY p.id, p.name, od.name),
    x AS (SELECT *, round(100 * coalesce(outside_hours, 0) / hours, 2) AS outside_hours_pct FROM w)
    SELECT project, owner_dept, team_size, outside_staff, outside_hours_pct,
           rank() OVER (ORDER BY outside_hours_pct DESC) AS pct_rank
    FROM x ORDER BY pct_rank, project_id
  right: |
    SELECT t.project, t.owner_dept, t.team_size, t.outside_staff, t.pct AS outside_hours_pct,
           rank() OVER (ORDER BY t.pct DESC) AS pct_rank
    FROM (SELECT p.id, p.name AS project, od.name AS owner_dept, count(*) AS team_size,
                 sum(CASE WHEN e.dept_id <> p.dept_id THEN 1 ELSE 0 END) AS outside_staff,
                 round(100.0 * sum(CASE WHEN e.dept_id <> p.dept_id THEN a.hours ELSE 0 END) / sum(a.hours), 2) AS pct
          FROM project_assignments a JOIN projects p ON p.id = a.project_id JOIN departments od ON od.id = p.dept_id
          JOIN employees e ON e.id = a.emp_id
          WHERE a.emp_id IN (SELECT id FROM employees WHERE hire_date <= p.start_date)
          GROUP BY p.id, p.name, od.name) t
    ORDER BY pct_rank, t.id
