mk-001:
  wrong: |
    SELECT c.country, count(DISTINCT o.id) AS orders, sum(i.quantity) AS units, sum(i.quantity * p.price) AS revenue
    FROM orders o JOIN customers c ON c.id = o.customer_id JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id
    WHERE o.status = 'delivered' AND o.order_date >= '2023-01-01' AND o.order_date < '2024-01-01'
    GROUP BY c.country ORDER BY revenue DESC, c.country
  right: |
    WITH d AS (SELECT id, customer_id FROM orders WHERE status='delivered' AND extract(year FROM order_date)=2023),
    l AS (SELECT order_id, sum(quantity) u, sum(quantity*unit_price) r FROM order_items GROUP BY order_id)
    SELECT c.country, count(*) AS orders, sum(l.u) AS units, sum(l.r) AS revenue
    FROM d JOIN customers c ON c.id=d.customer_id JOIN l ON l.order_id=d.id GROUP BY c.country ORDER BY 4 DESC, 1
mk-002:
  wrong: |
    SELECT pay.method, count(*) AS orders, sum(i.quantity) AS units, sum(pay.amount) AS paid_total
    FROM payments pay JOIN orders o ON o.id = pay.order_id JOIN order_items i ON i.order_id = o.id
    WHERE o.order_date >= '2024-01-01' AND o.order_date < '2024-07-01'
    GROUP BY pay.method ORDER BY paid_total DESC, pay.method
  right: |
    SELECT p.method, count(DISTINCT p.order_id) AS orders,
      (SELECT sum(quantity) FROM order_items i WHERE i.order_id = ANY(array_agg(p.order_id))) AS units, sum(p.amount) AS paid_total
    FROM payments p JOIN orders o ON o.id=p.order_id WHERE o.order_date BETWEEN '2024-01-01' AND '2024-06-30'
    GROUP BY p.method ORDER BY 4 DESC, 1
mk-003:
  wrong: |
    WITH u AS (
      SELECT c.country, i.product_id, sum(i.quantity) AS units
      FROM orders o JOIN customers c ON c.id = o.customer_id JOIN order_items i ON i.order_id = o.id
      WHERE o.status = 'delivered' AND o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
      GROUP BY c.country, i.product_id),
    r AS (SELECT *, row_number() OVER (PARTITION BY country ORDER BY units DESC, product_id) AS rnk FROM u)
    SELECT r.country, r.rnk AS rank, r.product_id, p.name, r.units
    FROM r JOIN products p ON p.id = r.product_id WHERE r.rnk <= 3 ORDER BY r.country, r.rnk, r.product_id
  right: |
    SELECT country, rnk AS rank, product_id, name, units FROM (
      SELECT c.country, i.product_id, p.name, sum(i.quantity) AS units,
             dense_rank() OVER (PARTITION BY c.country ORDER BY sum(i.quantity) DESC) AS drk,
             rank() OVER (PARTITION BY c.country ORDER BY sum(i.quantity) DESC) AS rnk
      FROM order_items i JOIN orders o ON o.id=i.order_id JOIN customers c ON c.id=o.customer_id JOIN products p ON p.id=i.product_id
      WHERE o.status='delivered' AND extract(year FROM o.order_date)=2024
      GROUP BY c.country, i.product_id, p.name) t
    WHERE rnk <= 3 ORDER BY country, rnk, product_id
mk-004:
  wrong: |
    SELECT c.segment, count(*) AS customers, count(*) FILTER (WHERE o.id IS NULL) AS never_bought,
           round(100.0 * count(*) FILTER (WHERE o.id IS NULL) / count(*), 1) AS never_bought_pct
    FROM customers c LEFT JOIN orders o ON o.customer_id = c.id
    GROUP BY c.segment ORDER BY c.segment
  right: |
    WITH buyers AS (SELECT DISTINCT customer_id FROM orders WHERE status IN ('shipped','delivered','returned'))
    SELECT c.segment, count(*) AS customers, count(*) - count(b.customer_id) AS never_bought,
           round(100.0 * (count(*) - count(b.customer_id)) / count(*), 1) AS never_bought_pct
    FROM customers c LEFT JOIN buyers b ON b.customer_id = c.id GROUP BY c.segment ORDER BY 1
mk-005:
  wrong: |
    SELECT cat.name AS category, parent.name AS parent_category,
           coalesce(sum(i.quantity) FILTER (WHERE o.status = 'delivered'), 0) AS delivered_units,
           coalesce(sum(i.quantity) FILTER (WHERE o.status = 'returned'), 0) AS returned_units,
           round(100.0 * coalesce(sum(i.quantity) FILTER (WHERE o.status = 'returned'), 0) / sum(i.quantity), 2) AS return_pct
    FROM order_items i JOIN orders o ON o.id = i.order_id JOIN products p ON p.id = i.product_id
    JOIN categories cat ON cat.id = p.category_id LEFT JOIN categories parent ON parent.id = cat.parent_id
    GROUP BY cat.id, cat.name, parent.name ORDER BY return_pct DESC, cat.name
  right: |
    WITH u AS (SELECT p.category_id, o.status, sum(i.quantity) q
               FROM order_items i JOIN orders o ON o.id=i.order_id JOIN products p ON p.id=i.product_id
               WHERE o.status IN ('delivered','returned') GROUP BY 1,2)
    SELECT c.name AS category, pc.name AS parent_category,
           coalesce(sum(u.q) FILTER (WHERE u.status='delivered'),0) AS delivered_units,
           coalesce(sum(u.q) FILTER (WHERE u.status='returned'),0) AS returned_units,
           round(100.0*coalesce(sum(u.q) FILTER (WHERE u.status='returned'),0)/sum(u.q),2) AS return_pct
    FROM u JOIN categories c ON c.id=u.category_id LEFT JOIN categories pc ON pc.id=c.parent_id
    GROUP BY c.id, c.name, pc.name ORDER BY 5 DESC, 1
mk-006:
  wrong: |
    WITH g AS (
      SELECT customer_id, status,
             order_date - lag(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, id) AS gap_days
      FROM orders)
    SELECT customer_id,
           count(*) AS delivered_orders,
           round(avg(gap_days), 1) AS avg_gap_days,
           max(gap_days) AS longest_gap_days
    FROM g
    WHERE status = 'delivered'
    GROUP BY customer_id
    HAVING count(*) >= 20
    ORDER BY avg_gap_days, customer_id
  right: |
    SELECT o.customer_id, count(*) AS delivered_orders, round(avg(o.order_date - p.order_date), 1) AS avg_gap_days,
           max(o.order_date - p.order_date) AS longest_gap_days
    FROM orders o
    LEFT JOIN LATERAL (SELECT x.order_date FROM orders x WHERE x.customer_id = o.customer_id AND x.status = 'delivered'
                       AND (x.order_date, x.id) < (o.order_date, o.id) ORDER BY x.order_date DESC, x.id DESC LIMIT 1) p ON true
    WHERE o.status = 'delivered'
    GROUP BY o.customer_id HAVING count(*) >= 20
    ORDER BY 3, 1
mk-007:
