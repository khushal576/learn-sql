             AND t.tx_date BETWEEN a.tx_date - 29 AND a.tx_date) AS s,
             row_number() OVER (PARTITION BY a.account_id ORDER BY (SELECT -sum(t.amount) FROM transactions t WHERE t.account_id = a.account_id AND t.kind = 'purchase'
             AND t.tx_date BETWEEN a.tx_date - 29 AND a.tx_date) DESC, a.tx_date) AS rn
      FROM (SELECT DISTINCT account_id, tx_date FROM transactions WHERE kind = 'purchase') a) d
    WHERE d.rn = 1 ORDER BY d.s DESC, d.account_id LIMIT 10
mk-019:
  wrong: |
