mk-021:
  wrong: |
    WITH RECURSIVE l AS (
      SELECT id, principal, annual_rate / 1200.0 AS r, term_months AS n,
             principal * (annual_rate / 1200.0) / (1 - power(1 + annual_rate / 1200.0, -term_months)) AS pmt
      FROM loans WHERE id IN (2, 5)),
    s AS (
      SELECT id AS loan_id, 1 AS month_no, pmt AS payment, principal * r AS interest, principal::numeric AS opening, principal::numeric AS principal, r, n
      FROM l
      UNION ALL
      SELECT s.loan_id, s.month_no + 1, s.payment, s.principal * s.r, s.opening - (s.payment - s.principal * s.r), s.principal, s.r, s.n
      FROM s WHERE s.month_no < s.n)
    SELECT loan_id, month_no, round(payment, 2) AS payment, round(interest, 2) AS interest,
           round(payment - interest, 2) AS principal_paid, round(opening - (payment - interest), 2) AS balance_after
    FROM s ORDER BY loan_id, month_no
  right: |
    SELECT l.id AS loan_id, k AS month_no, round(m.pmt, 2) AS payment,
           round(bal_prev * m.r, 2) AS interest,
           round(m.pmt - bal_prev * m.r, 2) AS principal_paid,
           round(bal_prev - (m.pmt - bal_prev * m.r), 2) AS balance_after
    FROM loans l
    CROSS JOIN LATERAL (SELECT l.annual_rate / 1200.0 AS r, l.principal * (l.annual_rate / 1200.0) / (1 - power(1 + l.annual_rate / 1200.0, -l.term_months)) AS pmt) m
    CROSS JOIN LATERAL generate_series(1, l.term_months) k
    CROSS JOIN LATERAL (SELECT l.principal * power(1 + m.r, k - 1) - m.pmt * (power(1 + m.r, k - 1) - 1) / m.r AS bal_prev) b
    WHERE l.id IN (2, 5) ORDER BY 1, 2
