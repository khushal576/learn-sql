          FROM transactions t GROUP BY t.account_id, t.tx_date) x
    JOIN accounts a ON a.id = x.account_id AND a.type = 'checking'
    WHERE x.bal + a.overdraft_limit < 0
    GROUP BY x.account_id ORDER BY 2 DESC, 1 FETCH FIRST 10 ROWS ONLY
mk-018:
  wrong: |
    WITH daily AS (SELECT account_id, tx_date, -sum(amount) AS spend FROM transactions WHERE kind = 'purchase' GROUP BY account_id, tx_date),
    roll AS (SELECT account_id, tx_date,
             sum(spend) OVER (PARTITION BY account_id ORDER BY tx_date ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) AS spend_30d FROM daily),
    best AS (SELECT *, row_number() OVER (PARTITION BY account_id ORDER BY spend_30d DESC, tx_date) AS rn FROM roll)
    SELECT account_id, tx_date AS window_end, spend_30d AS peak_spend_30d FROM best WHERE rn = 1
    ORDER BY peak_spend_30d DESC, account_id LIMIT 10
  right: |
    SELECT d.account_id, d.tx_date AS window_end, d.s AS peak_spend_30d FROM (
