mk-011:
  wrong: |
    WITH x AS (
      SELECT e.id, e.name, e.dept_id, e.salary, avg(e.salary) OVER (PARTITION BY e.dept_id) AS dept_avg FROM employees e)
    SELECT x.id, x.name, d.name AS department, x.salary, round(x.dept_avg, 2) AS dept_avg
    FROM x JOIN departments d ON d.id = x.dept_id
    WHERE x.salary > x.dept_avg AND x.id NOT IN (SELECT manager_id FROM employees)
    ORDER BY x.salary DESC, x.id LIMIT 15
  right: |
    SELECT e.id, e.name, d.name AS department, e.salary, round(a.av, 2) AS dept_avg
    FROM employees e JOIN departments d ON d.id = e.dept_id
    JOIN (SELECT dept_id, avg(salary) av FROM employees GROUP BY dept_id) a ON a.dept_id = e.dept_id
    LEFT JOIN (SELECT DISTINCT manager_id FROM employees WHERE manager_id IS NOT NULL) m ON m.manager_id = e.id
    WHERE m.manager_id IS NULL AND e.salary > a.av
    ORDER BY e.salary DESC, e.id LIMIT 15
mk-012:
  wrong: |
