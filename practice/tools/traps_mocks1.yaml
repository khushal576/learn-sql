mk-009:
  wrong: |
    WITH sales AS (
      SELECT c.id AS root_id, p.id AS product_id, p.name AS product_name, sum(i.quantity * i.unit_price) AS revenue
      FROM orders o JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id
      JOIN categories c ON c.id = p.category_id
      WHERE o.status = 'delivered' AND o.order_date >= '2023-01-01' AND o.order_date < '2024-01-01' AND c.parent_id IS NULL
      GROUP BY c.id, p.id, p.name),
    agg AS (SELECT *, sum(revenue) OVER (PARTITION BY root_id) AS root_revenue,
            row_number() OVER (PARTITION BY root_id ORDER BY revenue DESC, product_id) AS rn FROM sales)
    SELECT c.name AS department, a.root_revenue AS revenue,
           round(100.0 * a.root_revenue / sum(a.root_revenue) OVER (), 2) AS share_pct, a.product_name AS best_product
    FROM agg a JOIN categories c ON c.id = a.root_id WHERE a.rn = 1 ORDER BY revenue DESC
  right: |
    SELECT d.name AS department, sum(x.rev) AS revenue, round(100.0*sum(x.rev)/sum(sum(x.rev)) OVER (), 2) AS share_pct,
           (SELECT p2.name FROM order_items i2 JOIN orders o2 ON o2.id=i2.order_id JOIN products p2 ON p2.id=i2.product_id
            WHERE o2.status='delivered' AND o2.order_date BETWEEN '2023-01-01' AND '2023-12-31'
              AND p2.category_id IN (SELECT c3.id FROM categories c3 WHERE c3.id=d.id OR c3.parent_id=d.id OR c3.parent_id IN (SELECT id FROM categories WHERE parent_id=d.id))
            GROUP BY p2.id, p2.name ORDER BY sum(i2.quantity*i2.unit_price) DESC, p2.id LIMIT 1) AS best_product
    FROM categories d
    JOIN LATERAL (
      SELECT sum(i.quantity*i.unit_price) rev FROM order_items i JOIN orders o ON o.id=i.order_id JOIN products p ON p.id=i.product_id
      JOIN categories c ON c.id=p.category_id
      WHERE o.status='delivered' AND o.order_date BETWEEN '2023-01-01' AND '2023-12-31'
        AND (c.id=d.id OR c.parent_id=d.id OR c.parent_id IN (SELECT id FROM categories WHERE parent_id=d.id))) x ON true
    WHERE d.parent_id IS NULL GROUP BY d.id, d.name ORDER BY 2 DESC
