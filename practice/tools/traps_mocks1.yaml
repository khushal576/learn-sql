mk-017:
  wrong: |
    WITH run AS (
      SELECT t.account_id, t.tx_date, sum(t.amount) OVER (PARTITION BY t.account_id ORDER BY t.tx_date, t.id) AS balance
      FROM transactions t)
    SELECT r.account_id, count(DISTINCT r.tx_date) AS days_over_limit, min(r.balance) AS worst_balance
    FROM run r JOIN accounts a ON a.id = r.account_id
    WHERE a.type = 'checking' AND r.balance < -a.overdraft_limit
    GROUP BY r.account_id ORDER BY days_over_limit DESC, r.account_id LIMIT 10
  right: |
    SELECT x.account_id, count(*) AS days_over_limit, min(x.bal) AS worst_balance
