    SELECT id, right(translate(phone, '+()-. ', ''), 10) AS national_number FROM users WHERE id <= 40 AND phone IS NOT NULL ORDER BY id
ds-011:
  wrong: |
    SELECT lower(trim(split_part(email, '@', 2))) AS domain, count(*) AS users FROM users GROUP BY split_part(email, '@', 2) ORDER BY users DESC LIMIT 1
  right: |
    SELECT domain, users FROM (SELECT split_part(lower(btrim(email)), '@', 2) AS domain, count(*) AS users, rank() OVER (ORDER BY count(*) DESC) AS rk FROM users GROUP BY 1) t WHERE rk = 1 ORDER BY domain
ds-012:
  wrong: |
    SELECT id, coalesce(array_to_string(tags, ','), '(none)') AS tag_list FROM users WHERE id <= 25 ORDER BY id
