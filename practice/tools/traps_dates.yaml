ds-001:
  wrong: |
    SELECT (signup_at AT TIME ZONE 'UTC')::date AS signup_date, count(*) AS signups FROM users WHERE signup_at BETWEEN '2024-03-01' AND '2024-03-31' GROUP BY 1 ORDER BY 1
  right: |
    SELECT d AS signup_date, count(*) AS signups FROM (SELECT (signup_at AT TIME ZONE 'UTC')::date AS d FROM users) t WHERE d >= date '2024-03-01' AND d < date '2024-04-01' GROUP BY d ORDER BY d
