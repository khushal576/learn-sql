ds-016:
  wrong: |
    WITH f AS (SELECT u.id, u.tz, u.signup_at, min(e.ts) AS first_ts FROM users u JOIN events e ON e.user_id = u.id AND e.name <> 'signup' GROUP BY u.id, u.tz, u.signup_at) SELECT tz, count(*) AS users_with_activity, count(*) FILTER (WHERE (first_ts AT TIME ZONE 'UTC')::date <> (signup_at AT TIME ZONE 'UTC')::date) AS crossed_midnight FROM f GROUP BY tz ORDER BY tz
  right: |
