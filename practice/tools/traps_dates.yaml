ds-003:
  wrong: |
    SELECT id, full_name, initcap(trim(full_name)) AS clean_name FROM users WHERE id <= 60 AND full_name <> initcap(trim(full_name)) ORDER BY id
  right: |
    SELECT id, full_name, regexp_replace(initcap(btrim(full_name)), ' {2,}', ' ', 'g') AS clean_name FROM users WHERE id <= 60 AND full_name <> regexp_replace(initcap(btrim(full_name)), ' {2,}', ' ', 'g') ORDER BY id
ds-004:
  wrong: |
    SELECT trim(to_char(signup_at AT TIME ZONE 'UTC', 'Day')) AS weekday, count(*) AS signups FROM users GROUP BY 1 ORDER BY 1
  right: |
    SELECT trim(to_char(signup_at AT TIME ZONE 'UTC', 'Day')) AS weekday, count(*) AS signups FROM users GROUP BY 1, extract(isodow FROM signup_at AT TIME ZONE 'UTC') ORDER BY extract(isodow FROM signup_at AT TIME ZONE 'UTC')
ds-005:
  wrong: |
    SELECT tz, count(*) AS shifted_users FROM users WHERE (signup_at AT TIME ZONE tz)::date <> (signup_at AT TIME ZONE 'UTC')::date GROUP BY tz ORDER BY shifted_users DESC, tz
  right: |
    SELECT tz, sum(CASE WHEN (signup_at AT TIME ZONE tz)::date <> (signup_at AT TIME ZONE 'UTC')::date THEN 1 ELSE 0 END) AS shifted_users FROM users GROUP BY tz ORDER BY shifted_users DESC, tz
ds-006:
  wrong: |
    SELECT ((extract(hour FROM e.ts AT TIME ZONE 'UTC')::int + 5) % 24) AS local_hour, count(*) AS events FROM events e JOIN users u ON u.id = e.user_id WHERE u.tz = 'Asia/Kolkata' GROUP BY 1 ORDER BY 1
  right: |
    SELECT date_part('hour', (e.ts AT TIME ZONE 'UTC') + interval '5 hours 30 minutes')::int AS local_hour, count(*) AS events FROM events e WHERE e.user_id IN (SELECT id FROM users WHERE tz = 'Asia/Kolkata') GROUP BY 1 ORDER BY 1
ds-007:
  wrong: |
    SELECT extract(hour FROM (e.ts AT TIME ZONE 'UTC') - interval '5 hours')::int AS local_hour, count(*) AS events FROM events e JOIN users u ON u.id = e.user_id WHERE u.tz = 'America/New_York' AND ((e.ts AT TIME ZONE 'UTC') - interval '5 hours')::date = date '2024-03-10' GROUP BY 1 ORDER BY 1
  right: |
    SELECT date_part('hour', e.ts AT TIME ZONE 'America/New_York')::int AS local_hour, count(*) AS events FROM events e WHERE e.user_id IN (SELECT id FROM users WHERE tz = 'America/New_York') AND e.ts >= timestamptz '2024-03-10 00:00 America/New_York' AND e.ts < timestamptz '2024-03-11 00:00 America/New_York' GROUP BY 1 ORDER BY 1
ds-008:
  wrong: |
    SELECT id AS user_id, (extract(month FROM date '2024-04-10') - extract(month FROM signup_at AT TIME ZONE 'UTC'))::int AS months FROM users WHERE id <= 30 ORDER BY id
  right: |
    SELECT id AS user_id, ((extract(year FROM date '2024-04-10') - extract(year FROM s)) * 12 + extract(month FROM date '2024-04-10') - extract(month FROM s) - CASE WHEN extract(day FROM date '2024-04-10') < extract(day FROM s) THEN 1 ELSE 0 END)::int AS months FROM (SELECT id, (signup_at AT TIME ZONE 'UTC')::date AS s FROM users WHERE id <= 30) t ORDER BY id
ds-009:
  wrong: |
    SELECT date_trunc('week', ts AT TIME ZONE 'UTC')::date AS week_start, count(DISTINCT user_id) AS active_users FROM events WHERE ts >= timestamptz '2024-01-01 00:00+00' AND ts < timestamptz '2024-03-01 00:00+00' GROUP BY 1 ORDER BY 1
  right: |
    SELECT (d - extract(dow FROM d)::int)::date AS week_start, count(DISTINCT user_id) AS active_users FROM (SELECT user_id, (ts AT TIME ZONE 'UTC')::date AS d FROM events WHERE ts >= timestamptz '2024-01-01 00:00+00' AND ts < timestamptz '2024-03-01 00:00+00') t GROUP BY 1 ORDER BY 1
ds-010:
  wrong: |
    SELECT id, right(regexp_replace(phone, '\D', ''), 10) AS national_number FROM users WHERE id <= 40 AND phone IS NOT NULL ORDER BY id
