    SELECT id, coalesce(nullif((SELECT string_agg(t, ',' ORDER BY t COLLATE "C") FROM unnest(tags) t), ''), '(none)') AS tag_list FROM users WHERE id <= 25 ORDER BY id
ds-013:
  wrong: |
    SELECT b.user_id, b.signup_date, b.last_purchase_date, (SELECT count(*) FROM generate_series(0, b.last_purchase_date - b.signup_date) g(i) WHERE extract(isodow FROM b.signup_date + g.i) < 6)::int AS business_days FROM (SELECT p.user_id, (u.signup_at AT TIME ZONE 'UTC')::date AS signup_date, (max(p.ts) AT TIME ZONE 'UTC')::date AS last_purchase_date FROM purchases p JOIN users u ON u.id = p.user_id GROUP BY p.user_id, u.signup_at ORDER BY p.user_id LIMIT 20) b ORDER BY b.user_id
  right: |
    WITH b AS (SELECT p.user_id, (u.signup_at AT TIME ZONE 'UTC')::date AS s, (max(p.ts) AT TIME ZONE 'UTC')::date AS l FROM purchases p JOIN users u ON u.id = p.user_id GROUP BY p.user_id, u.signup_at ORDER BY p.user_id LIMIT 20) SELECT b.user_id, b.s AS signup_date, b.l AS last_purchase_date, count(d.day)::int AS business_days FROM b LEFT JOIN LATERAL (SELECT (b.s + g)::date AS day FROM generate_series(1, b.l - b.s) g WHERE extract(isodow FROM b.s + g) BETWEEN 1 AND 5) d ON true GROUP BY b.user_id, b.s, b.l ORDER BY b.user_id
ds-014:
  wrong: |
    SELECT b.id AS booking_id, to_char(n.night, 'YYYY-MM') AS month, count(*) AS nights FROM bookings b CROSS JOIN LATERAL generate_series(b.check_in::timestamp, b.check_out::timestamp, interval '1 day') AS n(night) WHERE b.room_id BETWEEN 33 AND 36 AND b.status = 'confirmed' AND b.check_out - b.check_in >= 30 GROUP BY b.id, 2 ORDER BY b.id, 2
  right: |
    SELECT b.id AS booking_id, to_char(m.ms, 'YYYY-MM') AS month, (least(b.check_out, (m.ms + interval '1 month')::date) - greatest(b.check_in, m.ms::date)) AS nights FROM bookings b CROSS JOIN LATERAL generate_series(date_trunc('month', b.check_in::timestamp), (b.check_out - 1)::timestamp, interval '1 month') AS m(ms) WHERE b.room_id BETWEEN 33 AND 36 AND b.status = 'confirmed' AND b.check_out - b.check_in >= 30 ORDER BY b.id, 2
