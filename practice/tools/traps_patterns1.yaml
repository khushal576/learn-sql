ip-007:
  wrong: |
    SELECT user_id, min(started_on) AS span_start, max(ended_on) AS span_end
    FROM subscriptions
    WHERE user_id IN (SELECT user_id FROM subscriptions GROUP BY user_id HAVING count(*) > 1)
    GROUP BY user_id ORDER BY user_id, span_start
  right: |
    SELECT s.user_id, s.started_on AS span_start,
           CASE WHEN n.id IS NOT NULL THEN n.ended_on ELSE s.ended_on END AS span_end
    FROM subscriptions s
    LEFT JOIN subscriptions n ON n.user_id = s.user_id AND n.started_on = s.ended_on + 1
    WHERE s.user_id IN (SELECT user_id FROM subscriptions GROUP BY user_id HAVING count(*) > 1)
      AND NOT EXISTS (SELECT 1 FROM subscriptions p WHERE p.user_id = s.user_id AND p.ended_on + 1 = s.started_on)
    ORDER BY s.user_id, s.started_on
ip-008:
  wrong: |
    SELECT user_id, prev_ended_on, started_on AS next_started_on, started_on - prev_ended_on AS idle_days
    FROM (SELECT user_id, started_on, lag(ended_on) OVER (PARTITION BY user_id ORDER BY started_on) AS prev_ended_on FROM subscriptions) t
    WHERE prev_ended_on IS NOT NULL AND started_on - prev_ended_on > 0
    ORDER BY user_id
  right: |
    SELECT a.user_id, a.ended_on AS prev_ended_on, b.started_on AS next_started_on, b.started_on - a.ended_on - 1 AS idle_days
    FROM subscriptions a JOIN subscriptions b ON b.user_id = a.user_id AND b.started_on > a.ended_on
    WHERE b.started_on - a.ended_on > 1
      AND NOT EXISTS (SELECT 1 FROM subscriptions c WHERE c.user_id = a.user_id AND c.started_on > a.ended_on AND c.started_on < b.started_on)
    ORDER BY a.user_id
