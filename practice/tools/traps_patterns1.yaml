    s AS (SELECT *, sum(starts) OVER (PARTITION BY user_id ORDER BY ts, id) AS session_no FROM g),
    ps AS (SELECT user_id, session_no, count(*) AS n, extract(epoch FROM max(ts) - min(ts)) / 60 AS minutes FROM s GROUP BY user_id, session_no)
