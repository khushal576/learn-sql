ip-001:
  wrong: |
    WITH s AS (SELECT DISTINCT (ts AT TIME ZONE 'UTC')::date AS d FROM events WHERE name = 'signup'),
    c AS (SELECT g::date AS day FROM generate_series((SELECT min(d) FROM s)::timestamp, (SELECT max(d) FROM s)::timestamp, interval '1 day') g)
    SELECT day FROM c WHERE day NOT IN (SELECT d FROM s) ORDER BY day
  right: |
    SELECT c.d::date AS day
    FROM generate_series('2024-01-01'::date, '2024-04-30'::date, interval '1 day') c(d)
    LEFT JOIN (SELECT DISTINCT (ts AT TIME ZONE 'UTC')::date AS sd FROM events WHERE name = 'signup') s ON s.sd = c.d::date
    WHERE s.sd IS NULL ORDER BY 1
ip-002:
  wrong: |
