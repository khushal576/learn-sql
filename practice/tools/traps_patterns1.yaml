    k AS (SELECT user_id, ts, count(*) FILTER (WHERE gap IS NULL OR gap > interval '30 minutes') OVER (PARTITION BY user_id ORDER BY ts ROWS UNBOUNDED PRECEDING) AS sn FROM e),
    p AS (SELECT user_id, sn, count(*) AS n, extract(epoch FROM max(ts) - min(ts)) / 60 AS m FROM k GROUP BY 1, 2)
    SELECT user_id, count(*) AS sessions, round(sum(n)::numeric / count(*), 2) AS avg_events_per_session, round(max(m)::numeric, 1) AS longest_session_minutes
