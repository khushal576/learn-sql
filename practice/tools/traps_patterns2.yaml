ip-016:
  wrong: |
    SELECT name AS step, count(*) AS users,
           round(100.0 * count(*) / lag(count(*)) OVER (ORDER BY count(*) DESC), 1) AS pct_of_previous_step
    FROM events WHERE name IN ('signup','activated','purchase') GROUP BY name ORDER BY users DESC
  right: |
    SELECT step, users, round(100.0 * users / nullif(prev, 0), 1) AS pct_of_previous_step FROM (
      SELECT step, users, lag(users) OVER (ORDER BY users DESC) AS prev FROM (
        SELECT e.name AS step, count(DISTINCT e.user_id) AS users FROM events e
        WHERE e.name IN ('signup','activated','purchase') GROUP BY e.name) a) b
    ORDER BY users DESC
