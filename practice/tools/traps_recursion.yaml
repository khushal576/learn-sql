rc-008:
  wrong: |
    WITH RECURSIVE walk AS (
      SELECT 1 AS hub, 0 AS hops
      UNION ALL
      SELECT r.to_hub, w.hops + 1 FROM walk w JOIN routes r ON r.from_hub = w.hub WHERE w.hops < 5
    )
    SELECT hub AS hub_id, min(hops) AS hops FROM walk WHERE hub <> 1 GROUP BY hub ORDER BY hops, hub
  right: |
    WITH RECURSIVE seen(hub, hops) AS (
      SELECT to_hub, 1 FROM routes WHERE from_hub = 1
