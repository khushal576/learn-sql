rc-013:
  wrong: |
    WITH RECURSIVE walk AS (
      SELECT 1 AS hub, ARRAY[1] AS path, 0 AS km, 0 AS hops
      UNION ALL
      SELECT r.to_hub, w.path || r.to_hub, w.km + r.km, w.hops + 1 FROM walk w JOIN routes r ON r.from_hub = w.hub WHERE w.hops < 3
    )
    SELECT array_to_string(path, ' > ') AS path, km AS total_km FROM walk WHERE hub = 4 ORDER BY km, path
  right: |
    WITH RECURSIVE walk(hub, path, km) AS (
      SELECT to_hub, '1 > ' || to_hub, km FROM routes WHERE from_hub = 1
      UNION ALL
      SELECT r.to_hub, w.path || ' > ' || r.to_hub, w.km + r.km
      FROM walk w JOIN routes r ON r.from_hub = w.hub
      WHERE w.hub <> 4 AND position(' ' || r.to_hub::text || ' ' IN ' ' || replace(w.path, '>', ' ') || ' ') = 0
    )
    SELECT path, km AS total_km FROM walk WHERE hub = 4 ORDER BY km, path
rc-014:
  wrong: |
    SELECT r.id AS region_id, r.name, 0 AS level, count(h.id) AS hub_count FROM regions r LEFT JOIN hubs h ON h.region_id = r.id GROUP BY r.id, r.name ORDER BY r.id
  right: |
    WITH RECURSIVE up(start_id, cur, lvl) AS (
      SELECT id, id, 1 FROM regions
      UNION ALL
      SELECT up.start_id, r.parent_id, up.lvl + 1 FROM up JOIN regions r ON r.id = up.cur WHERE r.parent_id IS NOT NULL
    ), depth AS (
      SELECT start_id AS id, max(lvl) AS level FROM up GROUP BY start_id
    )
    SELECT r.id AS region_id, r.name, d.level,
           (SELECT count(*) FROM hubs h JOIN up u ON u.start_id = h.region_id WHERE u.cur = r.id) AS hub_count
    FROM regions r JOIN depth d ON d.id = r.id ORDER BY r.id
rc-015:
  wrong: |
    SELECT s.id AS driver_id, 0 AS level, count(d.id) AS subordinates, 0 AS team_km FROM drivers s LEFT JOIN drivers d ON d.supervisor_id = s.id GROUP BY s.id ORDER BY s.id
  right: |
    WITH RECURSIVE up(member, cur, lvl) AS (
      SELECT id, id, 1 FROM drivers
      UNION ALL
      SELECT up.member, d.supervisor_id, up.lvl + 1 FROM up JOIN drivers d ON d.id = up.cur WHERE d.supervisor_id IS NOT NULL
    ), lv AS (SELECT member, max(lvl) AS level FROM up GROUP BY member)
    SELECT dr.id AS driver_id, lv.level,
      (SELECT count(*) FROM up WHERE cur = dr.id AND member <> dr.id) AS subordinates,
      coalesce((SELECT sum(t.km) FROM up JOIN trips t ON t.driver_id = up.member WHERE up.cur = dr.id AND t.status = 'done'), 0) AS team_km
    FROM drivers dr JOIN lv ON lv.member = dr.id ORDER BY dr.id
rc-016:
  wrong: |
    SELECT DISTINCT a.from_hub AS hub_id FROM routes a JOIN routes b ON b.from_hub = a.to_hub AND b.to_hub = a.from_hub ORDER BY hub_id
  right: |
    WITH RECURSIVE walk AS (
      SELECT from_hub AS start, to_hub AS cur, ARRAY[from_hub, to_hub] AS path FROM routes
      UNION ALL
      SELECT w.start, r.to_hub, w.path || r.to_hub FROM walk w JOIN routes r ON r.from_hub = w.cur WHERE w.cur <> w.start AND (r.to_hub = w.start OR r.to_hub <> ALL (w.path))
    )
    SELECT DISTINCT start AS hub_id FROM walk WHERE cur = start ORDER BY hub_id
