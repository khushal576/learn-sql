rc-018:
  wrong: |
    SELECT row_number() OVER (ORDER BY min(e.id)) AS level, count(*) AS headcount, round(avg(e.salary), 2) AS avg_salary FROM employees e GROUP BY e.job_title ORDER BY level
  right: |
    WITH RECURSIVE up(id, cur, lvl) AS (
      SELECT id, manager_id, 1 FROM employees
      UNION ALL
      SELECT up.id, e.manager_id, up.lvl + 1 FROM up JOIN employees e ON e.id = up.cur
    )
    SELECT max_l.level, count(*) AS headcount, round(avg(e.salary), 2) AS avg_salary
    FROM (SELECT id, max(lvl) AS level FROM up GROUP BY id) max_l JOIN employees e ON e.id = max_l.id
    GROUP BY max_l.level ORDER BY max_l.level
