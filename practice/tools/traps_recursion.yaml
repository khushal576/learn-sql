rc-002:
  wrong: |
    SELECT 1 AS level, m.id, m.name, m.job_title FROM employees e JOIN employees m ON m.id = e.manager_id WHERE e.id = 120 ORDER BY level
  right: |
    WITH RECURSIVE up(level, id, name, job_title, manager_id) AS (
      SELECT 0, id, name, job_title, manager_id FROM employees WHERE id = 120
      UNION ALL
      SELECT up.level + 1, m.id, m.name, m.job_title, m.manager_id FROM up JOIN employees m ON m.id = up.manager_id
    )
    SELECT level, id, name, job_title FROM up WHERE level > 0 ORDER BY level
rc-003:
  wrong: |
    SELECT c.id AS city_id, p.name || ' > ' || c.name AS path FROM regions c JOIN regions p ON p.id = c.parent_id WHERE c.id >= 18 ORDER BY c.id
  right: |
    SELECT c.id AS city_id, w.name || ' > ' || co.name || ' > ' || s.name || ' > ' || c.name AS path
    FROM regions c JOIN regions s ON s.id = c.parent_id JOIN regions co ON co.id = s.parent_id JOIN regions w ON w.id = co.parent_id
    WHERE w.parent_id IS NULL ORDER BY c.id
rc-004:
  wrong: |
    SELECT started_at::date AS day, count(*) AS cancelled_trips FROM trips WHERE status = 'cancelled' AND started_at >= '2024-01-01' AND started_at < '2024-02-01' GROUP BY 1 ORDER BY 1
  right: |
    SELECT d::date AS day, (SELECT count(*) FROM trips t WHERE t.status = 'cancelled' AND t.started_at >= d AND t.started_at < d + interval '1 day') AS cancelled_trips
    FROM generate_series(DATE '2024-01-01', DATE '2024-01-31', interval '1 day') d ORDER BY 1
