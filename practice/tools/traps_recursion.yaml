    )
    SELECT hub AS hub_id, min(hops) AS hops FROM seen WHERE hub <> 1 GROUP BY hub ORDER BY hops, hub
rc-009:
  wrong: |
    WITH RECURSIVE walk AS (
      SELECT 1 AS hub, 0 AS km, 0 AS hops
      UNION ALL
      SELECT r.to_hub, w.km + r.km, w.hops + 1 FROM walk w JOIN routes r ON r.from_hub = w.hub WHERE w.hops < 6
    )
    SELECT hub AS hub_id, min(km) AS min_km FROM walk WHERE hub <> 1 GROUP BY hub ORDER BY hub
  right: |
    WITH RECURSIVE walk(hub, km, path) AS (
      SELECT to_hub, km, ARRAY[1, to_hub] FROM routes WHERE from_hub = 1
      UNION ALL
      SELECT r.to_hub, w.km + r.km, w.path || r.to_hub FROM walk w JOIN routes r ON r.from_hub = w.hub WHERE NOT (r.to_hub = ANY (w.path))
    )
    SELECT hub AS hub_id, min(km) AS min_km FROM walk GROUP BY hub ORDER BY hub
