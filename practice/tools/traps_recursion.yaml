rc-011:
  wrong: |
    WITH RECURSIVE f(n, a, b) AS (
      SELECT 1, 0, 1
      UNION ALL
      SELECT n + 1, b, a + b FROM f WHERE n < 15
    )
    SELECT n, a AS fib FROM f ORDER BY n
  right: |
    SELECT n, round(power((1 + sqrt(5)::numeric) / 2, n) / sqrt(5::numeric))::bigint AS fib FROM generate_series(1, 15) n ORDER BY n
