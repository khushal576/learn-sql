wf-002:
  wrong: SELECT customer_id, id AS order_id, row_number() OVER (ORDER BY order_date, id) AS order_no FROM orders WHERE customer_id <= 3 ORDER BY customer_id, order_no
  right: SELECT o.customer_id, o.id AS order_id, (SELECT count(*) FROM orders p WHERE p.customer_id = o.customer_id AND (p.order_date, p.id) <= (o.order_date, o.id)) AS order_no FROM orders o WHERE o.customer_id <= 3 ORDER BY 1, 3
wf-003:
  wrong: SELECT id, salary, rnk FROM (SELECT id, salary, row_number() OVER (ORDER BY salary, id) AS rnk FROM employees WHERE dept_id = 1) t WHERE rnk <= 7 ORDER BY rnk, id
  right: SELECT e.id, e.salary, (SELECT count(*) + 1 FROM employees x WHERE x.dept_id = 1 AND x.salary < e.salary) AS rnk FROM employees e WHERE e.dept_id = 1 AND (SELECT count(*) FROM employees x WHERE x.dept_id = 1 AND x.salary < e.salary) < 7 ORDER BY 3, 1
wf-004:
  wrong: SELECT customer_id, id AS order_id, order_date, lag(order_date) OVER (ORDER BY customer_id, order_date, id) AS prev_order_date, order_date - lag(order_date) OVER (ORDER BY customer_id, order_date, id) AS days_since FROM orders WHERE customer_id <= 5 ORDER BY customer_id, order_date, id
  right: SELECT o.customer_id, o.id AS order_id, o.order_date, p.d AS prev_order_date, o.order_date - p.d AS days_since FROM orders o LEFT JOIN LATERAL (SELECT max(order_date) AS d FROM orders x WHERE x.customer_id = o.customer_id AND x.order_date < o.order_date) p ON true WHERE o.customer_id <= 5 ORDER BY 1, 3, 2
wf-005:
  wrong: SELECT p.id AS product_id, p.name AS product, sum(i.quantity * i.unit_price) AS revenue, round(100.0 * sum(i.quantity * i.unit_price) / (SELECT sum(quantity * unit_price) FROM order_items), 2) AS pct_of_category FROM products p JOIN categories c ON c.id = p.category_id JOIN order_items i ON i.product_id = p.id WHERE c.name = 'Phones' GROUP BY p.id, p.name ORDER BY revenue DESC, p.id
  right: WITH r AS (SELECT p.id AS product_id, p.name AS product, sum(i.quantity * i.unit_price) AS revenue FROM products p JOIN categories c ON c.id = p.category_id JOIN order_items i ON i.product_id = p.id WHERE c.name = 'Phones' GROUP BY p.id, p.name) SELECT product_id, product, revenue, round(100.0 * revenue / (SELECT sum(revenue) FROM r), 2) AS pct_of_category FROM r ORDER BY revenue DESC, product_id
wf-006:
  wrong: SELECT account_id, id AS tx_id, tx_date, amount, sum(amount) OVER (PARTITION BY account_id ORDER BY tx_date) AS balance FROM transactions WHERE account_id <= 3 ORDER BY account_id, id
  right: SELECT account_id, id AS tx_id, tx_date, amount, sum(amount) OVER (PARTITION BY account_id ORDER BY tx_date, id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS balance FROM transactions WHERE account_id <= 3 ORDER BY 1, 2
wf-007:
  wrong: WITH m AS (SELECT date_trunc('month', o.order_date)::date AS month, sum(i.quantity * i.unit_price) AS revenue FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'delivered' GROUP BY 1) SELECT month, revenue, lag(revenue) OVER (ORDER BY month) AS prev_revenue, round((revenue - lag(revenue) OVER (ORDER BY month)) * 100.0 / revenue, 1) AS growth_pct FROM m ORDER BY month
  right: WITH m AS (SELECT date_trunc('month', o.order_date)::date AS month, sum(i.quantity * i.unit_price) AS revenue FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'delivered' GROUP BY 1) SELECT c.month, c.revenue, p.revenue AS prev_revenue, round((c.revenue - p.revenue) * 100.0 / p.revenue, 1) AS growth_pct FROM m c LEFT JOIN m p ON p.month = (c.month - interval '1 month')::date ORDER BY c.month
wf-008:
  wrong: SELECT id, dept_id, salary, round(avg(salary) OVER (), 2) AS dept_avg, round(salary - avg(salary) OVER (), 2) AS diff FROM employees WHERE dept_id IN (1, 2) ORDER BY dept_id, id
  right: SELECT e.id, e.dept_id, e.salary, round(d.a, 2) AS dept_avg, round(e.salary - d.a, 2) AS diff FROM employees e JOIN (SELECT dept_id, avg(salary) AS a FROM employees GROUP BY dept_id) d ON d.dept_id = e.dept_id WHERE e.dept_id IN (1, 2) ORDER BY e.dept_id, e.id
wf-009:
  wrong: SELECT student_id, score, ceil(row_number() OVER (ORDER BY score DESC, student_id) * 4.0 / count(*) OVER ())::int AS quartile FROM scores WHERE course_id = 1 AND exam = 'final' ORDER BY score DESC, student_id
  right: SELECT student_id, score, ntile(4) OVER w AS quartile FROM scores WHERE course_id = 1 AND exam = 'final' WINDOW w AS (ORDER BY score DESC, student_id) ORDER BY score DESC, student_id
wf-010:
  wrong: SELECT emp_id, effective_date, salary FROM (SELECT emp_id, effective_date, salary, row_number() OVER (PARTITION BY emp_id ORDER BY effective_date) AS rn FROM salary_history WHERE emp_id <= 20) t WHERE rn = 1 ORDER BY emp_id
  right: SELECT h.emp_id, h.effective_date, h.salary FROM salary_history h WHERE h.emp_id <= 20 AND h.effective_date = (SELECT max(effective_date) FROM salary_history x WHERE x.emp_id = h.emp_id) ORDER BY h.emp_id
wf-011:
  wrong: SELECT customer_id, tx_id, amount FROM (SELECT a.customer_id, t.id AS tx_id, t.amount, row_number() OVER (PARTITION BY a.customer_id ORDER BY t.amount, t.id) AS rn FROM transactions t JOIN accounts a ON a.id = t.account_id WHERE a.customer_id <= 40 AND t.kind IN ('withdrawal', 'purchase')) x WHERE rn = 1 ORDER BY customer_id, tx_id
  right: WITH o AS (SELECT a.customer_id, t.id AS tx_id, t.amount FROM transactions t JOIN accounts a ON a.id = t.account_id WHERE a.customer_id <= 40 AND t.kind IN ('withdrawal', 'purchase')) SELECT customer_id, tx_id, amount FROM o WHERE amount = (SELECT min(amount) FROM o o2 WHERE o2.customer_id = o.customer_id) ORDER BY 1, 2
wf-012:
  wrong: WITH d AS (SELECT c.country, c.id AS customer_id, count(*) AS delivered_orders FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'delivered' GROUP BY c.country, c.id), r AS (SELECT *, row_number() OVER (PARTITION BY country ORDER BY delivered_orders DESC, customer_id) AS rnk FROM d) SELECT country, customer_id, delivered_orders, rnk FROM r WHERE rnk <= 3 ORDER BY country, rnk, customer_id
  right: WITH d AS (SELECT c.country, c.id AS customer_id, count(*) AS n FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'delivered' GROUP BY c.country, c.id) SELECT country, customer_id, n AS delivered_orders, (SELECT count(*) + 1 FROM d x WHERE x.country = d.country AND x.n > d.n) AS rnk FROM d WHERE (SELECT count(*) FROM d x WHERE x.country = d.country AND x.n > d.n) < 3 ORDER BY 1, 4, 2
wf-013:
  wrong: SELECT id, salary, row_number() OVER (ORDER BY salary DESC, id) AS row_num, dense_rank() OVER (ORDER BY salary DESC) AS rnk, rank() OVER (ORDER BY salary DESC) AS dense_rnk FROM employees WHERE dept_id = 1 ORDER BY salary DESC, id
  right: SELECT e.id, e.salary, (SELECT count(*) FROM employees x WHERE x.dept_id = 1 AND (x.salary > e.salary OR (x.salary = e.salary AND x.id <= e.id))) AS row_num, (SELECT count(*) + 1 FROM employees x WHERE x.dept_id = 1 AND x.salary > e.salary) AS rnk, (SELECT count(DISTINCT x.salary) + 1 FROM employees x WHERE x.dept_id = 1 AND x.salary > e.salary) AS dense_rnk FROM employees e WHERE e.dept_id = 1 ORDER BY e.salary DESC, e.id
wf-014:
  wrong: SELECT tx_id, account_id, amount, round(a, 2) AS avg_abs FROM (SELECT id AS tx_id, account_id, amount, avg(amount) OVER (PARTITION BY account_id) AS a FROM transactions WHERE account_id <= 20) t WHERE abs(amount) > 3 * abs(a) ORDER BY account_id, tx_id
  right: SELECT t.id AS tx_id, t.account_id, t.amount, round(a.v, 2) AS avg_abs FROM transactions t JOIN (SELECT account_id, avg(abs(amount)) AS v FROM transactions WHERE account_id <= 20 GROUP BY account_id) a ON a.account_id = t.account_id WHERE abs(t.amount) > 3 * a.v ORDER BY t.account_id, t.id
wf-015:
  wrong: SELECT c.id AS customer_id, o1.order_date AS first_order_date, o2.order_date AS second_order_date, o2.order_date - o1.order_date AS days_between FROM customers c LEFT JOIN LATERAL (SELECT order_date FROM orders WHERE customer_id = c.id ORDER BY order_date, id LIMIT 1) o1 ON true LEFT JOIN LATERAL (SELECT order_date FROM orders WHERE customer_id = c.id ORDER BY order_date, id OFFSET 1 LIMIT 1) o2 ON true WHERE c.id BETWEEN 85 AND 100 ORDER BY c.id
  right: SELECT o1.customer_id, o1.order_date AS first_order_date, o2.order_date AS second_order_date, o2.order_date - o1.order_date AS days_between FROM (SELECT customer_id, order_date, row_number() OVER (PARTITION BY customer_id ORDER BY order_date, id) AS rn FROM orders) o1 JOIN (SELECT customer_id, order_date, row_number() OVER (PARTITION BY customer_id ORDER BY order_date, id) AS rn FROM orders) o2 ON o2.customer_id = o1.customer_id AND o2.rn = 2 WHERE o1.rn = 1 AND o1.customer_id BETWEEN 85 AND 100 ORDER BY 1
