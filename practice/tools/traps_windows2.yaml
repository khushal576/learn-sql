wf-030:
  wrong: |
    WITH p AS (SELECT product_id, sum(quantity*unit_price) AS revenue FROM order_items GROUP BY product_id),
    c AS (SELECT *, sum(revenue) OVER (ORDER BY revenue DESC, product_id) AS cum, sum(revenue) OVER () AS total FROM p)
    SELECT product_id, revenue, round(100*cum/total,2) AS cum_pct FROM c WHERE round(100*cum/total,2) <= 50 ORDER BY revenue DESC, product_id
  right: |
    WITH p AS (SELECT product_id, sum(quantity*unit_price) AS revenue FROM order_items GROUP BY product_id),
    c AS (SELECT *, sum(revenue) OVER (ORDER BY revenue DESC, product_id ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS before_sum, sum(revenue) OVER (ORDER BY revenue DESC, product_id) AS cum, sum(revenue) OVER () AS total FROM p)
    SELECT product_id, revenue, round(100*cum/total,2) AS cum_pct FROM c WHERE coalesce(before_sum,0)*2 < total ORDER BY revenue DESC, product_id
