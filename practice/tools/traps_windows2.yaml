  right: |
    SELECT customer_id, id AS order_id, order_date, status, first_value(status) OVER (PARTITION BY customer_id ORDER BY order_date DESC, id DESC) AS latest_status FROM orders WHERE customer_id<=5 ORDER BY customer_id, order_date, id

wf-020:
