wf-026:
  wrong: |
    WITH r AS (SELECT t.account_id, t.tx_date, sum(t.amount) OVER (PARTITION BY t.account_id ORDER BY t.tx_date) AS bal FROM transactions t JOIN accounts a ON a.id=t.account_id WHERE a.type='checking' AND a.id<=60)
    SELECT account_id, min(tx_date) AS first_negative_date, min(bal) AS balance FROM r WHERE bal<0 GROUP BY account_id ORDER BY account_id
  right: |
    WITH r AS (SELECT t.account_id, t.tx_date, t.id, sum(t.amount) OVER (PARTITION BY t.account_id ORDER BY t.tx_date, t.id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS bal FROM transactions t JOIN accounts a ON a.id=t.account_id WHERE a.type='checking' AND a.id<=60)
    SELECT DISTINCT ON (account_id) account_id, tx_date AS first_negative_date, bal AS balance FROM r WHERE bal<0 ORDER BY account_id, tx_date, id

wf-027:
  wrong: |
    WITH s AS (SELECT o.customer_id, sum(i.quantity*i.unit_price) AS spend FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' GROUP BY o.customer_id),
    b AS (SELECT min(spend) AS lo, max(spend) AS hi FROM s)
    SELECT 11 - least(10, 1 + floor(10*(s.spend-b.lo)/(b.hi-b.lo))::int) AS decile, count(*) AS customers, sum(s.spend) AS revenue FROM s, b GROUP BY 1 ORDER BY 1
  right: |
    WITH s AS (SELECT o.customer_id, sum(i.quantity*i.unit_price) AS spend FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' GROUP BY o.customer_id),
    r AS (SELECT *, row_number() OVER (ORDER BY spend DESC, customer_id) AS rn, count(*) OVER () AS total FROM s)
    SELECT CASE WHEN rn <= (total % 10) * (total / 10 + 1) THEN (rn - 1) / (total / 10 + 1) + 1 ELSE total % 10 + (rn - (total % 10) * (total / 10 + 1) - 1) / (total / 10) + 1 END AS decile, count(*) AS customers, sum(spend) AS revenue FROM r GROUP BY 1 ORDER BY 1

wf-028:
  wrong: |
    WITH x AS (SELECT id, hire_date, salary, round(avg(salary) OVER (ORDER BY hire_date, id ROWS BETWEEN 3 PRECEDING AND CURRENT ROW),2) AS prev3_avg FROM employees)
    SELECT id, salary, prev3_avg, round(salary - prev3_avg,2) AS diff FROM x WHERE hire_date>='2020-01-01' ORDER BY hire_date, id
  right: |
    WITH r AS (SELECT id, hire_date, salary, row_number() OVER (ORDER BY hire_date, id) AS rn FROM employees),
    x AS (SELECT a.id, a.hire_date, a.salary, round(avg(b.salary),2) AS prev3_avg, count(*) AS n FROM r a JOIN r b ON b.rn BETWEEN a.rn-3 AND a.rn-1 GROUP BY a.id, a.hire_date, a.salary)
    SELECT id, salary, prev3_avg, round(salary - prev3_avg,2) AS diff FROM x WHERE hire_date>='2020-01-01' AND n=3 ORDER BY hire_date, id

wf-029:
  wrong: |
    SELECT id, tx_date, amount, sum(amount) OVER (ORDER BY tx_date, id ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) AS rolling_30d FROM transactions WHERE account_id=5 ORDER BY tx_date, id
  right: |
    SELECT t.id, t.tx_date, t.amount, (SELECT sum(x.amount) FROM transactions x WHERE x.account_id=t.account_id AND x.tx_date BETWEEN t.tx_date-29 AND t.tx_date) AS rolling_30d
