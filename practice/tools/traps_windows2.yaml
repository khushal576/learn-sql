    WHERE o.status<>'cancelled' AND o.customer_id<=65 GROUP BY o.customer_id ORDER BY o.customer_id

wf-021:
  wrong: |
    SELECT course_id, student_id, score, round(avg(score) OVER (), 2) AS course_avg, round(score - avg(score) OVER (), 2) AS vs_avg FROM scores WHERE exam='midterm' AND course_id IN (1,2) ORDER BY course_id, score DESC, student_id
  right: |
    SELECT s.course_id, s.student_id, s.score, round(m.a,2) AS course_avg, round(s.score - m.a,2) AS vs_avg FROM scores s JOIN (SELECT course_id, avg(score) AS a FROM scores WHERE exam='midterm' GROUP BY course_id) m ON m.course_id=s.course_id
    WHERE s.exam='midterm' AND s.course_id IN (1,2) ORDER BY s.course_id, s.score DESC, s.student_id

