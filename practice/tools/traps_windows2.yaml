wf-016:
  wrong: |
    WITH d AS (SELECT o.order_date AS day, sum(i.quantity*i.unit_price) AS revenue FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' AND o.order_date BETWEEN '2023-01-01' AND '2023-01-31' GROUP BY o.order_date)
    SELECT day, revenue, round(avg(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW),2) AS ma7 FROM d ORDER BY day
  right: |
    WITH d AS (SELECT o.order_date AS day, sum(i.quantity*i.unit_price) AS revenue FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' AND o.order_date BETWEEN '2023-01-01' AND '2023-01-31' GROUP BY o.order_date)
    SELECT a.day, a.revenue, (SELECT CASE WHEN count(*)=7 THEN round(avg(b.revenue),2) END FROM d b WHERE b.day BETWEEN a.day-6 AND a.day) AS ma7 FROM d a ORDER BY a.day

wf-017:
  wrong: |
    WITH v AS (SELECT o.customer_id, o.id AS order_id, o.order_date, sum(i.quantity*i.unit_price) AS order_value FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' AND o.customer_id<=3 GROUP BY o.customer_id,o.id,o.order_date)
    SELECT customer_id, order_id, order_date, order_value, sum(order_value) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS running_spend,
    round(100*sum(order_value) OVER (PARTITION BY customer_id ORDER BY order_date, order_id)/sum(order_value) OVER (), 2) AS pct_of_lifetime FROM v ORDER BY customer_id, order_date, order_id
  right: |
    WITH v AS (SELECT o.customer_id, o.id AS order_id, o.order_date, sum(i.quantity*i.unit_price) AS order_value FROM orders o JOIN order_items i ON i.order_id=o.id WHERE o.status<>'cancelled' AND o.customer_id<=3 GROUP BY o.customer_id,o.id,o.order_date)
    SELECT a.customer_id, a.order_id, a.order_date, a.order_value, (SELECT sum(b.order_value) FROM v b WHERE b.customer_id=a.customer_id AND (b.order_date,b.order_id)<=(a.order_date,a.order_id)) AS running_spend,
    round(100*(SELECT sum(b.order_value) FROM v b WHERE b.customer_id=a.customer_id AND (b.order_date,b.order_id)<=(a.order_date,a.order_id))/(SELECT sum(b.order_value) FROM v b WHERE b.customer_id=a.customer_id),2) AS pct_of_lifetime
    FROM v a ORDER BY 1,3,2

wf-018:
  wrong: |
    SELECT emp_id, effective_date, salary, salary - lag(salary) OVER (ORDER BY emp_id, effective_date) AS change,
    round(100.0*(salary - lag(salary) OVER (ORDER BY emp_id, effective_date))/lag(salary) OVER (ORDER BY emp_id, effective_date),1) AS pct_change
    FROM salary_history WHERE emp_id<=15 ORDER BY emp_id, effective_date
  right: |
    SELECT h.emp_id, h.effective_date, h.salary, h.salary - p.salary AS change, round(100.0*(h.salary-p.salary)/p.salary,1) AS pct_change
    FROM salary_history h LEFT JOIN LATERAL (SELECT salary FROM salary_history x WHERE x.emp_id=h.emp_id AND x.effective_date<h.effective_date ORDER BY x.effective_date DESC LIMIT 1) p ON true
    WHERE h.emp_id<=15 ORDER BY h.emp_id, h.effective_date

