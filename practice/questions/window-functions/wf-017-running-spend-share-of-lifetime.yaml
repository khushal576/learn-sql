id: wf-017
title: "Running spend and share of lifetime spend"
topic: window-functions
tags: [running-total, partition-by, percent]
difficulty: medium
dataset: ecommerce
prompt: |
  CRM wants to see how fast our first customers (**customer ids 1 to 3**) reached their lifetime spend. Order value =
  `sum(quantity * unit_price)` of the order's lines; ignore cancelled orders.

  For every order return `customer_id`, `order_id`, `order_date`, `order_value`, `running_spend` (the customer's spend up to and
  including this order, ordered by `order_date`, then `order_id`) and `pct_of_lifetime` (running spend as a percentage 0-100 of the
  customer's **total** spend over all their orders, rounded to 2 decimals). Order by `customer_id`, `order_date`, `order_id`.
solution_sql: |
  WITH v AS (
    SELECT o.customer_id, o.id AS order_id, o.order_date, sum(i.quantity * i.unit_price) AS order_value
    FROM orders o JOIN order_items i ON i.order_id = o.id
    WHERE o.status <> 'cancelled' AND o.customer_id <= 3
    GROUP BY o.customer_id, o.id, o.order_date
  )
  SELECT customer_id, order_id, order_date, order_value,
         sum(order_value) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS running_spend,
         round(100 * sum(order_value) OVER (PARTITION BY customer_id ORDER BY order_date, order_id)
                   / sum(order_value) OVER (PARTITION BY customer_id), 2) AS pct_of_lifetime
  FROM v
  ORDER BY customer_id, order_date, order_id
compare: {order_matters: true}
hints:
  - "You need two different sums over the same rows: one that grows (has an ORDER BY) and one that does not."
  - "A window with an ORDER BY accumulates; a window with only PARTITION BY gives the full-group total on every row."
trap: |
  `sum(order_value) OVER ()` (or a running sum with no `PARTITION BY`) mixes the three customers: the 'lifetime' denominator becomes everybody's spend, so every percentage is far too small (customer 1 ends at ~54% instead of 100%). Each window needs its own partition - and the lifetime total must have *no* ORDER BY, otherwise it is just the running total again.
followup: |
  "What fraction of customers reach 50% of their lifetime spend within their first 3 orders?" (Filter the CTE on `pct_of_lifetime >= 50`, take the first order per customer.)
