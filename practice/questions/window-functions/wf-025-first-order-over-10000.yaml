id: wf-025
title: "The order that took a customer past 10,000"
topic: window-functions
tags: [running-total, cte, filter-window]
difficulty: hard
dataset: ecommerce
prompt: |
  The loyalty team gives a gold card when a customer's **cumulative spend passes 10,000**. Order value = `sum(quantity * unit_price)`
  of the order's lines. Only orders that were not **cancelled** and not **returned** count as spend; cumulate by `order_date`, then `id`.

  For **customers 1 to 20** return the order that first pushed the cumulative spend **above 10,000**: `customer_id`, `order_id`,
  `order_date`, `cumulative_spend`. Customers who never get there are not listed. Order by `customer_id`.
solution_sql: |
  WITH v AS (
    SELECT o.customer_id, o.id AS order_id, o.order_date, sum(i.quantity * i.unit_price) AS order_value
    FROM orders o JOIN order_items i ON i.order_id = o.id
    WHERE o.status NOT IN ('cancelled', 'returned') AND o.customer_id <= 20
    GROUP BY o.customer_id, o.id, o.order_date
  ), c AS (
    SELECT *, sum(order_value) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS cumulative_spend
    FROM v
  ), f AS (
    SELECT *, row_number() OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS rn
    FROM c WHERE cumulative_spend > 10000
  )
  SELECT customer_id, order_id, order_date, cumulative_spend FROM f WHERE rn = 1 ORDER BY customer_id
compare: {order_matters: true}
hints:
  - "A window function cannot be used in WHERE - compute the cumulative sum in a CTE, filter in the next step."
  - "After filtering `cumulative_spend > 10000`, how do you keep only the first row per customer?"
trap: |
  Two traps. (1) You cannot write `WHERE sum(...) OVER (...) > 10000` - the window runs after WHERE, so it needs a CTE. (2) The status filter belongs *before* the cumulative sum: if cancelled/returned orders are summed too, the threshold is crossed too early - for customers 10 and 19 the 'first order over 10,000' is a different (earlier) order, and an extra customer appears that should not be listed.
followup: |
  "Now give me the days between the customer's signup and that order." (Join customers; date subtraction.) "Could you do it without a second window?" (`min(order_date) ... WHERE cumulative_spend > 10000` with `DISTINCT ON`.)
