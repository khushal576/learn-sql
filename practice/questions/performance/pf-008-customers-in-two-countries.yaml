id: pf-008
title: Customers in two countries
topic: performance
tags: [index, sargable, lower, ilike]
difficulty: medium
dataset: perf
prompt: |
  Marketing wants to size a campaign in **India** and **Kenya**: how many customers each of those two countries has, and how many of them signed up in 2025. `customers` has 50 000 rows, 12 countries (about 1/12 each) and a plain index on `country`. The dashboard query "defensively" ignores case and reads the whole table.

  Return `country`, `customers` (count), `joined_2025` (how many have `created_at` in 2025), ordered by `country`.
  Check also looks at the query plan: the country filter must use the index.
solution_sql: |
  SELECT country, count(*) AS customers, count(*) FILTER (WHERE created_at >= '2025-01-01' AND created_at < '2026-01-01') AS joined_2025 FROM customers WHERE country IN ('India', 'Kenya') GROUP BY country ORDER BY country
check:
  type: plan
  must_use: ["Index Scan|Index Only Scan|Bitmap Index Scan|Bitmap Heap Scan"]
  must_not_use: ["Seq Scan on customers"]
  note: "the country filter must be answered through the index on customers.country"
compare: {order_matters: true}
hints:
  - "The countries are stored exactly as 'India' and 'Kenya'."
  - "Which spellings of the filter keep `country` bare on one side of the comparison?"
trap: |
  `WHERE lower(country) IN ('india','kenya')` (or `ILIKE`) gives the identical result but cannot use the plain btree on `country`: no expression index exists for `lower(country)`, so all 50 000 rows are read. The same function that was *required* for `email` (it has a `lower(email)` index) is *harmful* here: always check what the index is built on.
followup: |
  "At what point would the planner ignore the index even with a clean predicate?" (When the filter returns a large share of the table, e.g. 'half the countries': a sequential scan is then cheaper than thousands of random heap visits.)
alternatives:
  - "SELECT country, count(*) AS customers, count(CASE WHEN created_at >= '2025-01-01' AND created_at < '2026-01-01' THEN 1 END) AS joined_2025 FROM customers WHERE country = 'India' OR country = 'Kenya' GROUP BY 1 ORDER BY 1"
