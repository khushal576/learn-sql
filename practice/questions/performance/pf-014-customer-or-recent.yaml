id: pf-014
title: "Refresh list: one customer or the last day"
topic: performance
tags: [or, bitmap-or, union, sargable]
difficulty: hard
dataset: perf
prompt: |
  A nightly sync must re-send every order that is **either** from **customer 123** **or** was created on **2025-12-29 or later** (the data ends on 2025-12-29). Both columns are indexed, and Postgres can combine two indexes for an `OR`, but the current job reads all 300 000 rows.

  Return `id`, `customer_id`, `created_at` (any order).
  Check also looks at the query plan: no sequential scan of `orders`.
solution_sql: |
  SELECT id, customer_id, created_at FROM orders
  WHERE customer_id = 123 OR created_at >= '2025-12-29'
check:
  type: plan
  must_use: ["Index Scan|Index Only Scan|Bitmap Index Scan|Bitmap Heap Scan"]
  must_not_use: ["Seq Scan on orders"]
  note: "both branches of the OR must be served by indexes"
compare: {order_matters: false}
hints:
  - "With OR, ONE branch the index cannot serve is enough to force a full scan: the planner needs every branch to be indexable."
  - "Check each branch on its own: does it compare a bare indexed column with a constant?"
trap: |
  Writing the date branch as `created_at::date = '2025-12-29'` gives the same 211 rows, but that branch is not sargable, and because it sits in an OR the whole filter falls back to a sequential scan, even though the `customer_id = 123` branch alone would be fast. Keep both branches bare, or split them with `UNION`.
followup: |
  "When is `UNION` better than `OR`?" (When branches use different indexes the planner can't merge, or one branch needs a different plan; `UNION ALL` plus `AND customer_id <> 123` in the second branch avoids both the duplicates and the sort-distinct.)
alternatives:
  - |
    SELECT id, customer_id, created_at FROM orders WHERE customer_id = 123 UNION SELECT id, customer_id, created_at FROM orders WHERE created_at >= '2025-12-29'
