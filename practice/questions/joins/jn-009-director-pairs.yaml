id: jn-009
title: Pairs of directors in the same department
topic: joins
tags: [self-join, pairs, inequality-join]
difficulty: medium
dataset: hr
prompt: |
  The company wants to set up peer-mentoring between **directors** (`job_title = 'Director'`). List every **pair of
  directors working in the same department**. A pair must appear **once** (not as A–B and again as B–A), and nobody
  is paired with themselves.

  Return `emp_a`, `emp_b` (the two ids, with `emp_a` smaller) and `dept_id`, ordered by `dept_id`, `emp_a`, `emp_b`.
solution_sql: |
  SELECT a.id AS emp_a, b.id AS emp_b, a.dept_id
  FROM employees a JOIN employees b ON a.dept_id = b.dept_id AND a.id < b.id
  WHERE a.job_title = 'Director' AND b.job_title = 'Director'
  ORDER BY a.dept_id, a.id, b.id
compare: {order_matters: true}
hints:
  - "Which comparison between the two ids gives each unordered pair exactly once?"
trap: |
  `a.id <> b.id` lists every pair **twice** (A–B and B–A); `a.id = b.id` or no id condition pairs people with themselves. `a.id < b.id` is the standard way to get each unordered pair once. The number of pairs grows as n·(n−1)/2 — be careful with big groups.
followup: |
  "How many pairs for a department with 1 000 people?" (499 500 — a self-join can explode; filter early.) "Triples instead of pairs?" (Three aliases with `a.id < b.id AND b.id < c.id`.)
