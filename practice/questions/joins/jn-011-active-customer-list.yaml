id: jn-011
title: One list of active customers
topic: joins
tags: [union, union-all, set-operations]
difficulty: medium
dataset: ecommerce
prompt: |
  Marketing defines an **active customer** as someone who **placed an order or wrote a review**. Build one list of
  the active customers among the **first 30 customers** (`id` 1 to 30) — each customer **once**.

  Return `customer_id`, ordered by `customer_id`.
solution_sql: |
  SELECT customer_id FROM orders WHERE customer_id <= 30
  UNION
  SELECT customer_id FROM reviews WHERE customer_id <= 30
  ORDER BY customer_id
compare: {order_matters: true}
hints:
  - "Two separate lists glued together — one of the glue operators removes duplicates."
trap: |
  `UNION ALL` keeps every row, so a customer with 60 orders and 5 reviews appears 65 times. `UNION` removes duplicates — but at a cost (a sort or hash over all rows), which is why you only use it when you actually need de-duplication, and `UNION ALL` when the two sets cannot overlap.
followup: |
  "Why is UNION ALL faster?" (No de-duplication pass.) "Rewrite without a set operator." (`SELECT id FROM customers c WHERE EXISTS (orders…) OR EXISTS (reviews…)`.)
