id: jn-016
title: Each customer's last two orders
topic: joins
tags: [lateral, top-n-per-group, limit]
difficulty: hard
dataset: ecommerce
prompt: |
  For the **first 10 customers** (`id` 1 to 10), show their **two most recent orders**. If two orders share a date,
  the one with the **higher `id`** is more recent.

  Return `customer_id`, `order_id` and `order_date`, ordered by `customer_id`, then most recent first.
solution_sql: |
  SELECT c.id AS customer_id, o.id AS order_id, o.order_date
  FROM customers c
  CROSS JOIN LATERAL (
    SELECT id, order_date FROM orders WHERE customer_id = c.id ORDER BY order_date DESC, id DESC LIMIT 2
  ) o
  WHERE c.id <= 10
  ORDER BY c.id, o.order_date DESC, o.id DESC
compare: {order_matters: true}
hints:
  - "A normal subquery cannot see the customer of the outer row. What can?"
  - "`LIMIT 2` inside the LATERAL subquery applies once PER customer."
trap: |
  A single `ORDER BY order_date DESC LIMIT 2` over the join returns two rows **in total**, not two per customer. `LATERAL` runs the subquery once per customer row, so the `LIMIT` is per group — and with an index on `(customer_id, order_date DESC, id DESC)` it stops after two index entries each.
followup: |
  "Solve it with a window function." (`ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC, id DESC) <= 2`.) "Which is faster for 100 customers out of 50 million orders?" (LATERAL + index: it never touches the other customers' orders.)
alternatives:
  - |
    SELECT customer_id, order_id, order_date FROM (
      SELECT customer_id, id AS order_id, order_date,
             row_number() OVER (PARTITION BY customer_id ORDER BY order_date DESC, id DESC) AS rn
      FROM orders WHERE customer_id <= 10) t
    WHERE rn <= 2 ORDER BY customer_id, order_date DESC, order_id DESC
