id: ds-006
title: Peak hours for Kolkata users
topic: dates-strings
tags: [at-time-zone, extract-hour, half-hour-offset]
difficulty: medium
dataset: events
prompt: |
  Support in Mumbai wants to staff by the **local clock**. Using **all events** of users whose `tz` is `'Asia/Kolkata'` (UTC+05:30, no daylight saving), count the events per **local hour of day** (0-23).

  Return `local_hour` (an integer) and `events`, ordered by `local_hour`.
solution_sql: |
  SELECT extract(hour FROM e.ts AT TIME ZONE 'Asia/Kolkata')::int AS local_hour, count(*) AS events
  FROM events e
  JOIN users u ON u.id = e.user_id
  WHERE u.tz = 'Asia/Kolkata'
  GROUP BY 1
  ORDER BY 1
compare: {order_matters: true}
hints:
  - "Convert the timestamp to local time first, then take the hour."
  - "India is not a whole number of hours away from UTC."
trap: |
  Adding a whole 5 hours to the UTC hour (`(extract(hour FROM ts AT TIME ZONE 'UTC') + 5) % 24`) forgets the extra 30 minutes: an event at 00:40 UTC is 06:10 locally, but this shortcut files it under hour 5. Every hour bucket is polluted by the neighbour (747 of the Kolkata events land in the wrong bucket). Let the time zone database do the shift with `AT TIME ZONE 'Asia/Kolkata'`.
followup: |
  "What changes for a zone that has daylight saving?" (The offset depends on the DATE, so a fixed `+N hours` is wrong half the year; only a named zone is right.)
alternatives:
  - |
    SELECT date_part('hour', (e.ts AT TIME ZONE 'UTC') + interval '5 hours 30 minutes')::int AS local_hour, count(*) AS events FROM events e WHERE e.user_id IN (SELECT id FROM users WHERE tz = 'Asia/Kolkata') GROUP BY 1 ORDER BY 1
