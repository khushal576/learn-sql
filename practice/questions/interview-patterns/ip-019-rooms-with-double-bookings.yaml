id: ip-019
title: Which rooms are double-booked, and how often
topic: interview-patterns
tags: [overlap, self-join, group-by]
difficulty: medium
dataset: hotel
prompt: |
  The hotel manager wants a short list of problem rooms rather than raw pairs. For each room that has at least one double-booking, return
  `room_number`, `room_type` and `conflicting_pairs` - the number of **pairs** of overlapping **confirmed** bookings in that room
  (stays occupy the nights `check_in .. check_out - 1`; `check_out` is exclusive, so back-to-back stays do not overlap).
  Order by `conflicting_pairs` descending, then `room_number`.
solution_sql: |
  SELECT r.number AS room_number, r.type AS room_type, count(*) AS conflicting_pairs
  FROM bookings a
  JOIN bookings b ON b.room_id = a.room_id AND a.id < b.id
                 AND a.check_in < b.check_out AND b.check_in < a.check_out
  JOIN rooms r ON r.id = a.room_id
  WHERE a.status = 'confirmed' AND b.status = 'confirmed'
  GROUP BY r.number, r.type
  ORDER BY conflicting_pairs DESC, r.number
compare: {order_matters: true}
hints:
  - "Find the pairs first, then group them by room."
  - "How do you make sure a pair is counted once and not as (a,b) and (b,a)?"
trap: |
  Joining with `a.id <> b.id` returns every pair in both directions, so each room's count is doubled (60 conflicts overall instead of 30).
followup: |
  "How many distinct bookings are affected?" Here each conflicting pair involves two different bookings and no booking is in two pairs, so 60 - but in general count(DISTINCT) over both sides, not 2 x pairs.
alternatives:
  - |
    SELECT r.number AS room_number, r.type AS room_type, count(*) AS conflicting_pairs
    FROM rooms r JOIN LATERAL (
      SELECT b.id FROM bookings a, bookings b
      WHERE a.room_id = r.id AND b.room_id = r.id AND a.id < b.id AND a.status = 'confirmed' AND b.status = 'confirmed'
        AND a.check_in < b.check_out AND b.check_in < a.check_out
    ) x ON true
    GROUP BY r.number, r.type ORDER BY 3 DESC, 1
