id: mk-013
title: Projects running on a given day
topic: mock-interviews
tags: ['null', date-range, left-join, as-of]
difficulty: easy
dataset: hr
prompt: |
  The PMO asks what was in flight on **2023-06-30**. A project is active on a day when it has started on or before that day and has **not ended before** it; `end_date` NULL means the project is still running.

  Return `project` (name), `department` (the owning department name), `start_date`, `end_date`, `team_size` (people assigned) and `total_hours` (sum of assigned hours), ordered by `start_date`, then project `id`.
solution_sql: |
  SELECT p.name AS project, d.name AS department, p.start_date, p.end_date,
         count(a.emp_id) AS team_size,
         coalesce(sum(a.hours), 0) AS total_hours
  FROM projects p
  JOIN departments d ON d.id = p.dept_id
  LEFT JOIN project_assignments a ON a.project_id = p.id
  WHERE p.start_date <= DATE '2023-06-30'
    AND (p.end_date IS NULL OR p.end_date >= DATE '2023-06-30')
  GROUP BY p.id, p.name, d.name, p.start_date, p.end_date
  ORDER BY p.start_date, p.id
compare: {order_matters: true}
hints: ['How do you compare a date with a column that may be NULL, and what should NULL mean here?', 'Team size and hours come from `project_assignments`: one row per person on a project.']
trap: '`end_date >= ''2023-06-30''` is NULL (not true) for the projects that are still running, so they vanish: only 2 of the 5 active projects (Helix and Juno) remain, and Cobalt, Falcon and Ion are lost. NULL end date has to be treated as ''open ended'' explicitly: `end_date IS NULL OR end_date >= ...`.'
followup: '"Make it a parameter: which projects overlapped the whole of Q3 2023?" (An interval overlap test: `start <= q_end AND coalesce(end, infinity) >= q_start`.)'
