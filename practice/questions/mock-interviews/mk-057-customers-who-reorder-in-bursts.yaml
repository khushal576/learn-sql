id: mk-057
title: "Customers who reorder in bursts"
topic: mock-interviews
tags: ["window", "lag", "date-difference"]
difficulty: hard
dataset: ecommerce
prompt: |
  Shreya: "Some customers reorder within days of their last order - I want to find the bursty ones."
  Ignore cancelled orders. For each customer, put their non-cancelled orders in chronological order (`order_date`, then `id`) and call an order a **quick reorder** when it was placed **14 days or less** after the customer's previous non-cancelled order (the first order of a customer is never a quick reorder).
  Return the customers with **at least 3** quick reorders: `customer_id`, `quick_reorders` (the count) and `last_quick_reorder` (the date of their most recent quick reorder). Order by `quick_reorders` descending, then `customer_id`.
solution_sql: |
  WITH g AS (
    SELECT customer_id, order_date,
           order_date - lag(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, id) AS gap
    FROM orders
    WHERE status <> 'cancelled'
  )
  SELECT customer_id, count(*) AS quick_reorders, max(order_date) AS last_quick_reorder
  FROM g
  WHERE gap <= 14
  GROUP BY customer_id
  HAVING count(*) >= 3
  ORDER BY quick_reorders DESC, customer_id
compare: {order_matters: true}
hints:
  - "lag(order_date) over each customer's orders gives the previous order date on the same row."
  - "Remove the cancelled orders BEFORE the window function sees them - otherwise a cancelled order becomes 'the previous order'."
  - "The first order has a NULL gap: the comparison gap <= 14 is then not true, which is what you want."
trap: |
  Applying lag() over all orders and only filtering the status afterwards (or not at all) measures the gap to a cancelled order: 30 customers qualify instead of the correct 27, and the counts of the others change.
followup: |
  "Average gap per customer?" avg(gap) from the same CTE - and note why integer date differences make the answer exact in days.
