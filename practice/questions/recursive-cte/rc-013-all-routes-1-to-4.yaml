id: rc-013
title: Every simple route from hub 1 to hub 4
topic: recursive-cte
tags:
- recursive
- graph
- cycle
- path
difficulty: hard
dataset: logistics
prompt: |
  A customer asks for alternatives: list **every route from hub 1 to hub 4** that never visits the same hub twice, with its total distance. The route map has loops, so the query must not circle forever.

  Return `path` (hub ids joined with ` > `, e.g. `1 > 4`) and `total_km`, ordered by `total_km`, then `path`.
solution_sql: |
  WITH RECURSIVE walk AS (
    SELECT 1 AS hub, ARRAY[1] AS path, 0 AS km
    UNION ALL
    SELECT r.to_hub, w.path || r.to_hub, w.km + r.km
    FROM walk w JOIN routes r ON r.from_hub = w.hub
    WHERE r.to_hub <> ALL (w.path)
  )
  SELECT array_to_string(path, ' > ') AS path, km AS total_km
  FROM walk WHERE hub = 4
  ORDER BY km, path
compare:
  order_matters: true
hints:
- 'You need the list of visited hubs in each row: both for the text and to stop revisiting.'
- Filter the destination in the final SELECT.
trap: |
  Without a visited-hub check the walk loops on 4 -> 5 -> 6 -> 4 and never ends; a depth cap fixes the loop but picks an arbitrary limit - capping at 3 hops finds only 3 of the 5 routes (the longest has 5 hops). Tracking the path gives exactly the 5 simple routes, from 200 km (direct) to 395 km.
followup: |
  "Only the shortest one?" (take the first row by `ORDER BY km LIMIT 1` - but see the shortest-distance question for a whole network.)
